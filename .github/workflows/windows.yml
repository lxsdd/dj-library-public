name: Windows build and synthetic self-test

on:
  push:
    branches:
      - main
      - 'migration/**'
      # Qualify this conflicted Draft's exact source HEAD even when GitHub
      # cannot synthesize a pull_request merge commit. Source-only, no uploads.
      - 'fix/virtual-subtrack-match-provenance-20261022'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dj-public-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout public DJ Library source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Checkout unchanged original Bridge v3 publisher source
        uses: actions/checkout@v5
        with:
          repository: lxsdd/foo_dj_library_bridge
          ref: f74c1c70c7e6744bc601f4c2ecaf1b7f4ba80803
          path: native-bridge-producer
          persist-credentials: false

      - name: Guard against tracked personal datasets
        shell: pwsh
        run: |
          $forbidden = @(git ls-files | Where-Object { $_ -match '(^|/)(catalog-seed|tracks\.tsv|cds\.tsv|matches\.tsv|digital-items|private-research|user-imports|local-fixtures)' })
          if ($forbidden.Count -gt 0) { throw ('Personal fixture paths are forbidden in the public tree: ' + ($forbidden -join ', ')) }

      - name: Checkout public metadata normalizer at pinned revision
        uses: actions/checkout@v5
        with:
          repository: lxsdd/dj-metadata-normalizer
          path: dj-metadata-normalizer
          ref: 365432ad8d6d0b80cc138c21e0d8fd8edca9e499
          persist-credentials: false

      - name: Build native metadata engine
        shell: pwsh
        run: |
          cmake -S dj-metadata-normalizer -B djmeta-build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'cmake configuration failed' }
          cmake --build djmeta-build --config Release --target djmeta_native
          if ($LASTEXITCODE -ne 0) { throw 'Native engine build failed' }
          Copy-Item djmeta-build/Release/djmeta_native.dll ./djmeta_native.dll
          New-Item -ItemType Directory -Force rules | Out-Null
          Copy-Item dj-metadata-normalizer/rules/default-rules.json rules/default-rules.json

      - name: Build full WPF application
        shell: cmd
        run: call BuildOnly.cmd

      - uses: microsoft/setup-msbuild@v2

      - name: Build original C++ Bridge v3 Publisher and materialize 54129-row native fixture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $pin='f74c1c70c7e6744bc601f4c2ecaf1b7f4ba80803'
          if((& git -C native-bridge-producer rev-parse HEAD).Trim() -cne $pin){throw 'Original Bridge source SHA mismatch'}
          $msbuild=(Get-Command msbuild.exe -ErrorAction Stop).Source
          & $msbuild native-bridge-producer/tests/publisher_integration.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /restore
          if($LASTEXITCODE -ne 0){throw 'Original C++ Bridge Publisher failed to build'}
          $testRoot=Join-Path $env:RUNNER_TEMP ('djlib-native-v3-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          if(Test-Path -LiteralPath $testRoot){throw 'Refusing an existing native fixture directory'}
          $exe='native-bridge-producer/out/x64/Release/publisher_integration.exe'
          if(-not(Test-Path -LiteralPath $exe -PathType Leaf)){throw 'Actual native Publisher exe missing'}
          & $exe $testRoot
          if($LASTEXITCODE -ne 0){throw 'Native Bridge v3 publisher fixture generation failed'}
          $stage=Join-Path $testRoot 'stages/g11-large'
          if(-not(Test-Path -LiteralPath (Join-Path $stage 'digital-items.tsv.gz') -PathType Leaf)){throw 'Native v3 54k producer snapshot missing'}
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('DJLIB_NATIVE_BRIDGE_FIXTURE=' + $stage)
          Write-Host 'PASS_ORIGINAL_CPP_BRIDGE_V3_PRODUCER_54129'

      - name: Run independent synthetic catalog, CDX and import tests
        shell: pwsh
        run: |
          # WPF compiles as /target:winexe. PowerShell's call operator may not
          # wait for a GUI-subsystem process or set LASTEXITCODE reliably.
          $process = Start-Process -FilePath './DJLibrary.exe' -ArgumentList '--self-test-public' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path SELF-TEST-ERROR.txt) { Get-Content SELF-TEST-ERROR.txt }
            throw 'Synthetic self test failed'
          }
          $report = Get-Content SELF-TEST.txt -Raw
          if (-not $report.Contains('PASS_PUBLIC_CONTRACT')) { throw "Synthetic self test incomplete: $report" }
          if (-not $report.Contains('PASS_NATIVE_PUBLISHER_V3_54129_LIVE_GENRE_AND_CUE')) { throw "Original C++ Bridge v3 to current full DJ Library matcher failed: $report" }
          Write-Host $report

      # Do not publish Windows product binaries from this source-only Draft.
      # Parallel source-only safety proposal PR #12 remains independent.
      - name: Package app without user data
        if: false
        shell: pwsh
        run: |
          $expected = @('DJLibrary.exe', 'djmeta_native.dll', 'rules/default-rules.json')
          foreach ($file in $expected) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing distributable: $file" }
          }
          New-Item -ItemType Directory -Force -Path public-dist/rules | Out-Null
          Copy-Item DJLibrary.exe public-dist/DJLibrary.exe
          Copy-Item djmeta_native.dll public-dist/djmeta_native.dll
          Copy-Item rules/default-rules.json public-dist/rules/default-rules.json
          Compress-Archive -Path public-dist/* -DestinationPath DJLibrary-public-portable.zip

      - name: Upload clean portable build
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: DJLibrary-public-portable
          path: DJLibrary-public-portable.zip
          if-no-files-found: error
          retention-days: 7
