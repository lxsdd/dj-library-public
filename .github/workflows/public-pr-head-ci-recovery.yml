name: Public PR HEAD CI recovery

# Only declared, currently open first-party PRs and existing read-only CI.
# This is a scheduled fallback for bot-originated commits without PR checks.
on:
  # Prove the pinned cross-repository workflow on a trusted main-only
  # update to this dispatcher; no normal product push can match.
  push:
    branches: [main]
    paths: ['.github/workflows/public-pr-head-ci-recovery.yml']
  schedule:
    - cron: '21 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  missing-pr-ci:
    uses: lxsdd/dev-infrastructure-public/.github/workflows/dispatch-pr-head-ci.yml@eed379ee8ed8a478285b437176ab61e12cfff0ce
    with:
      pr_numbers: '9,10'
      workflow_files: 'windows.yml'
      base_branch: main
