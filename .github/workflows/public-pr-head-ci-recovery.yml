name: Public PR HEAD CI recovery

# Only declared, currently open first-party PRs and existing read-only CI.
# This is a scheduled fallback for bot-originated commits without PR checks.
on:
  schedule:
    - cron: '21 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

jobs:
  missing-pr-ci:
    uses: lxsdd/dev-infrastructure-public/.github/workflows/dispatch-pr-head-ci.yml@0b3e6532761658a282662ca340ab7347ca8aa98b
    with:
      pr_numbers: '9,10'
      workflow_files: 'windows.yml'
      base_branch: main
