name: Experimental WinUI 3 catalog UX

on:
  pull_request:
    paths:
      - 'experiments/winui3/**'
      - 'experiments/shared/**'
      - 'experiments/wpf-ab/**'
      - 'experiments/synthetic-contract/**'
      - '.github/workflows/winui3-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winui3-spike-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compile-prototype:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/winui3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Verify identical deterministic fixture/filter/sort contracts
        shell: pwsh
        run: |
          dotnet run --project ../synthetic-contract/SyntheticContract.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Shared fixture contract failed' }
      - name: Compile WPF .NET 10 reference UI with identical model source
        shell: pwsh
        run: |
          dotnet build ../wpf-ab/DJLibrary.WpfAb.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { throw 'WPF A/B reference build failed' }
      - name: Exercise actual WPF window and DataGrid with synthetic catalogs
        shell: pwsh
        run: |
          $wpfReport = Join-Path $env:RUNNER_TEMP 'wpf-ab-compositor-report.txt'
          $env:DJLIB_WPF_AB_SMOKE_REPORT = $wpfReport
          $process = Start-Process dotnet -ArgumentList @('run','--project','../wpf-ab/DJLibrary.WpfAb.csproj','-c','Release','--no-build','--','--smoke') -PassThru
          try {
            if (-not $process.WaitForExit(90000)) { throw 'WPF visible-window smoke timed out after 90 seconds' }
            if (Test-Path -LiteralPath $wpfReport) { Get-Content -LiteralPath $wpfReport }
            if ($process.ExitCode -ne 0) { throw "WPF visible-window smoke failed with exit $($process.ExitCode)" }
            if (-not (Test-Path -LiteralPath $wpfReport)) { throw 'WPF compositor smoke report missing' }
            $txt = Get-Content -LiteralPath $wpfReport -Raw
            if (-not $txt.StartsWith("PASS`n")) { throw 'WPF window compositor smoke did not pass' }
            foreach ($n in @('1,345','15,000','54,129','100,000')) {
              if (-not $txt.Contains("PASS $n synthetic")) { throw "WPF compositor report missing $n" }
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            $process.Dispose()
          }
      - name: Restore pinned WinUI 3 and TableView dependencies
        shell: pwsh
        run: |
          dotnet restore DJLibrary.WinUiSpike.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'WinUI 3 restore failed' }
      - name: Compile Windows App SDK / WinUI TableView prototype
        shell: pwsh
        run: |
          dotnet build DJLibrary.WinUiSpike.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'WinUI 3 compile failed' }
      - name: Launch real WinUI 3 window and verify synthetic TableView runtime
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'winui3-smoke-report.txt'
          $env:DJLIB_WINUI_SMOKE_REPORT = $report
          $exe = Join-Path $PWD 'bin/Release/net10.0-windows10.0.19041.0/win-x64/DJLibrary.WinUiSpike.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "No unpackaged WinUI 3 executable at $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke' -PassThru
          try {
            if (-not $p.WaitForExit(110000)) { throw 'WinUI 3 real window / TableView smoke timed out' }
            if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
            if ($p.ExitCode -ne 0) { throw "WinUI 3 runtime exited with $($p.ExitCode)" }
            if (-not (Test-Path -LiteralPath $report)) {
              throw 'WinUI 3 did not reach its OnLaunched smoke-report checkpoint'
            }
            $result = Get-Content -LiteralPath $report -Raw
            if (-not $result.StartsWith("PASS`n")) {
              throw 'WinUI 3 reported a synthetic TableView runtime failure'
            }
            foreach ($size in @('1,345','15,000','54,129','100,000')) {
              if (-not $result.Contains("PASS $size synthetic")) {
                throw "Missing actual WinUI runtime assertion for $size"
              }
            }
          }
          finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            $p.Dispose()
          }
      - name: Clarify qualification boundary
        shell: pwsh
        run: |
          Write-Host 'Shared contracts compiled; real WinUI HWND, TableView layout, selection and next compositor callback executed in synthetic runtime.'
          Write-Host 'Rendering callback is not physical scanout; actual touchpad, DPI, accessibility, deployment and product GUI acceptance remain open.'
          Write-Host 'No production catalog/DB access or migration authorized.'
